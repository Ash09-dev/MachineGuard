    <div class="sidebar-footer">
      <button onclick="Auth.logout()" class="btn-logout">Logout</button>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main-content">
    <header class="top-header">
      <div>
        <span class="breadcrumb">Equipment Monitoring</span>
        <h1 class="page-title">Machines Inventory</h1>
      </div>
      <div class="user-profile">
        <div class="user-avatar">A</div>
        <div>
          <div class="user-name">Admin</div>
          <div class="user-role">Plant Manager</div>
        </div>
      </div>
    </header>

    <section class="content-body">
      <!-- Toolbar -->
      <div class="action-bar">
        <div class="search-filter-box">
          <input type="text" id="searchInput" placeholder="Search machine name or ID..." onkeyup="renderMachines()">
          <select id="statusFilter" onchange="renderMachines()">
            <option value="ALL">All Statuses</option>
            <option value="Healthy">Healthy</option>
            <option value="Warning">Warning</option>
            <option value="Critical">Critical</option>
          </select>
        </div>
        <button class="btn btn-primary" onclick="openAddModal()">
          + Add Machine
        </button>
      </div>

      <!-- Machine Grid / List -->
      <div class="machines-grid" id="machinesGrid">
        <!-- Rendered dynamically -->
      </div>
    </section>
  </main>

  <!-- Add Machine Modal -->
  <div id="addModal" class="modal-overlay hidden">
    <div class="modal-container">
      <div class="modal-header">
        <h3>Add New Machine</h3>
        <button class="close-btn" onclick="closeAddModal()">&times;</button>
      </div>
      <form id="addMachineForm" onsubmit="handleAddMachine(event)">
        <div class="modal-body">
          <div class="form-group">
            <label>Machine Name *</label>
            <input type="text" id="mName" placeholder="e.g. Motor-05, Compressor-01" required>
          </div>
          <div class="form-group">
            <label>Machine ID *</label>
            <input type="text" id="mId" placeholder="e.g. CMP-005" required>
          </div>
          <div class="form-group">
            <label>Machine Type *</label>
            <input type="text" id="mType" placeholder="e.g. Reciprocating Compressor, Conveyor" required>
          </div>
          <div class="form-group">
            <label>Location *</label>
            <input type="text" id="mLocation" placeholder="e.g. Assembly Line 2, Bay C" required>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Baseline RMS (mm/s) *</label>
              <input type="number" step="0.01" id="mBaseline" placeholder="2.10" required>
            </div>
            <div class="form-group">
              <label>Current RMS (mm/s) *</label>
              <input type="number" step="0.01" id="mCurrent" placeholder="2.45" required>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="closeAddModal()">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Machine</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Analysis Quick Modal -->
  <div id="analysisModal" class="modal-overlay hidden">
    <div class="modal-container modal-lg">
      <div class="modal-header">
        <div>
          <span class="badge-subtitle">MACHINE ANALYSIS</span>
          <h2 id="modalMachineName">Motor-01</h2>
        </div>
        <button class="close-btn" onclick="closeAnalysisModal()">&times;</button>
      </div>
      <div class="modal-body" id="analysisContent">
        <!-- Injected via script -->
      </div>
    </div>
  </div>

  <script src="auth.js"></script>
  <script src="machine-store.js"></script>
  <script>
    // Guard page access
    Auth.checkAuth();

    function renderMachines() {
      const grid = document.getElementById('machinesGrid');
      const search = document.getElementById('searchInput').value.toLowerCase();
      const filter = document.getElementById('statusFilter').value;
      
      const machines = MachineStore.getMachines();
      grid.innerHTML = '';

      const filtered = machines.filter(m => {
        const matchesSearch = m.name.toLowerCase().includes(search) || m.id.toLowerCase().includes(search);
        const matchesStatus = filter === 'ALL' || m.status === filter;
        return matchesSearch && matchesStatus;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `<div class="empty-state">No machines match your query.</div>`;
        return;
      }

      filtered.forEach(m => {
        const statusClass = m.status.toLowerCase();
        const card = document.createElement('div');
        card.className = `machine-card ${statusClass}`;
        card.innerHTML = `
          <div class="card-header">
            <div>
              <div class="machine-id">${m.id}</div>
              <h3 class="machine-title">${m.name}</h3>
              <p class="machine-sub">${m.type} • ${m.location}</p>
            </div>
            <span class="status-badge ${statusClass}">${m.status}</span>
          </div>

          <div class="card-metrics">
            <div class="metric">
              <span class="metric-label">Baseline RMS</span>
              <span class="metric-value">${m.baselineRMS.toFixed(2)} mm/s</span>
            </div>
            <div class="metric">
              <span class="metric-label">Current RMS</span>
              <span class="metric-value">${m.currentRMS.toFixed(2)} mm/s</span>
            </div>
            <div class="metric">
              <span class="metric-label">Health Score</span>
              <span class="metric-value ${statusClass}">${m.healthScore}%</span>
            </div>
          </div>

          <div class="card-actions">
            <button class="btn btn-outline" onclick="analyzeMachine('${m.id}')">Analyze</button>
            ${m.isCustom ? `<button class="btn btn-danger-outline" onclick="removeMachine('${m.id}')">Remove</button>` : ''}
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function openAddModal() {
      document.getElementById('addModal').classList.remove('hidden');
    }

    function closeAddModal() {
      document.getElementById('addModal').classList.add('hidden');
      document.getElementById('addMachineForm').reset();
    }

    function handleAddMachine(e) {
      e.preventDefault();
      const newMachine = {
        name: document.getElementById('mName').value.trim(),
        id: document.getElementById('mId').value.trim(),
        type: document.getElementById('mType').value.trim(),
        location: document.getElementById('mLocation').value.trim(),
        baselineRMS: document.getElementById('mBaseline').value,
        currentRMS: document.getElementById('mCurrent').value
      };

      MachineStore.addMachine(newMachine);
      closeAddModal();
      renderMachines();
    }

    function removeMachine(id) {
      if (confirm(`Are you sure you want to remove machine ${id}?`)) {
        MachineStore.removeMachine(id);
        renderMachines();
      }
    }

    function analyzeMachine(id) {
      const machines = MachineStore.getMachines();
      const m = machines.find(item => item.id === id);
      if (!m) return;

      const variance = (((m.currentRMS - m.baselineRMS) / m.baselineRMS) * 100).toFixed(1);
      
      document.getElementById('modalMachineName').textContent = m.name;
      document.getElementById('analysisContent').innerHTML = `
        <div class="analysis-summary">
          <div class="health-circle ${m.status.toLowerCase()}">
            <span class="score">${m.healthScore}%</span>
            <span class="label">Health</span>
          </div>
          <div class="analysis-text">
            <h4>Status: <span class="text-${m.status.toLowerCase()}">${m.status.toUpperCase()}</span></h4>
            <p>${m.status === 'Healthy' ? 'Vibration is within normal operational bounds.' : 'Vibration deviation detected above baseline limits.'}</p>
          </div>
        </div>

        <div class="analysis-grid">
          <div class="analysis-card">
            <span class="label">Current RMS</span>
            <span class="val">${m.currentRMS} mm/s</span>
          </div>
          <div class="analysis-card">
            <span class="label">Baseline RMS</span>
            <span class="val">${m.baselineRMS} mm/s</span>
          </div>
          <div class="analysis-card">
            <span class="label">RMS Change</span>
            <span class="val ${variance >= 0 ? 'text-critical' : 'text-healthy'}">${variance > 0 ? '+' : ''}${variance}%</span>
          </div>
        </div>
      `;
      document.getElementById('analysisModal').classList.remove('hidden');
    }

    function closeAnalysisModal() {
      document.getElementById('analysisModal').classList.add('hidden');
    }

    // Initial render
    renderMachines();
  </script>
</body>
</html>

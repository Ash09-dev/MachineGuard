<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | MachineGuard</title>
  <link rel="stylesheet" href="machineguard-pages.css">
</head>
<body class="login-body">
  <div class="login-card">
    <div class="brand-header">
      <div class="brand-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
        </svg>
      </div>
      <div>
        <h1 class="brand-title">MachineGuard</h1>
        <p class="brand-subtitle">Predictive Maintenance System</p>
      </div>
    </div>

    <form id="loginForm" class="login-form">
      <div id="errorMessage" class="error-banner hidden"></div>

      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="Enter username (e.g. admin)" required value="admin">
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter password (e.g. password123)" required value="password123">
      </div>

      <button type="submit" class="btn btn-primary btn-full">Sign In</button>
    </form>
  </div>

  <script src="auth.js"></script>
  <script>
    // Redirect if already logged in
    if (Auth.getUser()) {
      window.location.href = 'index.html';
    }

    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const user = document.getElementById('username').value.trim();
      const pass = document.getElementById('password').value.trim();
      const errEl = document.getElementById('errorMessage');

      const result = Auth.login(user, pass);
      if (result.success) {
        window.location.href = 'index.html';
      } else {
        errEl.textContent = result.message;
        errEl.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>

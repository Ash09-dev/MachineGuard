  <!-- Main Content -->
  <main class="main-content">
    <header class="top-header">
      <div>
        <span class="breadcrumb">System Diagnostics</span>
        <h1 class="page-title">Anomaly Alerts</h1>
      </div>
      <div class="user-profile">
        <div class="user-avatar">A</div>
        <div>
          <div class="user-name">Admin</div>
          <div class="user-role">Plant Manager</div>
        </div>
      </div>
    </header>

    <section class="content-body">
      <!-- Summary Counters -->
      <div class="alert-summary-cards">
        <div class="summary-card critical">
          <span class="summary-label">Critical Alerts</span>
          <span class="summary-count" id="cntCritical">0</span>
        </div>
        <div class="summary-card warning">
          <span class="summary-label">Warning Alerts</span>
          <span class="summary-count" id="cntWarning">0</span>
        </div>
        <div class="summary-card acknowledged">
          <span class="summary-label">Acknowledged</span>
          <span class="summary-count" id="cntAck">0</span>
        </div>
      </div>

      <!-- Filters & Actions -->
      <div class="action-bar" style="margin-top: 1.5rem;">
        <div class="search-filter-box">
          <select id="severityFilter" onchange="renderAlerts()">
            <option value="ALL">All Severities</option>
            <option value="Critical">Critical Only</option>
            <option value="Warning">Warning Only</option>
          </select>
          <select id="stateFilter" onchange="renderAlerts()">
            <option value="ALL">All States</option>
            <option value="Active">Active Alerts</option>
            <option value="Acknowledged">Acknowledged</option>
          </select>
        </div>
      </div>

      <!-- Alerts Table -->
      <div class="table-container">
        <table class="alerts-table">
          <thead>
            <tr>
              <th>Severity</th>
              <th>Machine</th>
              <th>Trigger & Anomaly details</th>
              <th>RMS Change</th>
              <th>Status</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="alertsTableBody">
            <!-- Dynamically Rendered -->
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="auth.js"></script>
  <script src="machine-store.js"></script>
  <script>
    Auth.checkAuth();

    const ALERTS_STORE_KEY = 'mg_alerts_data';

    // Generates active alerts directly from current machines data in machine-store
    function getAlerts() {
      let storedAlerts = JSON.parse(localStorage.getItem(ALERTS_STORE_KEY)) || [];
      const machines = MachineStore.getMachines();

      // Synchronize machines into alert records
      machines.forEach(m => {
        if (m.status === 'Critical' || m.status === 'Warning') {
          const existing = storedAlerts.find(a => a.machineId === m.id);
          const variance = (((m.currentRMS - m.baselineRMS) / m.baselineRMS) * 100).toFixed(1);
          
          if (!existing) {
            storedAlerts.push({
              id: 'ALT-' + Math.floor(1000 + Math.random() * 9000),
              machineId: m.id,
              machineName: m.name,
              location: m.location,
              severity: m.status,
              rmsDeviation: `+${variance}% (${m.currentRMS} mm/s vs ${m.baselineRMS} mm/s baseline)`,
              details: m.status === 'Critical' ? 'High vibration amplitude exceeds safety threshold. High risk of bearing fault.' : 'Slight vibration drift observed beyond 20% variance.',
              timestamp: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),
              acknowledged: false
            });
          }
        }
      });

      localStorage.setItem(ALERTS_STORE_KEY, JSON.stringify(storedAlerts));
      return storedAlerts;
    }

    function renderAlerts() {
      const tbody = document.getElementById('alertsTableBody');
      const severityFilter = document.getElementById('severityFilter').value;
      const stateFilter = document.getElementById('stateFilter').value;

      const alerts = getAlerts();

      // Counts
      document.getElementById('cntCritical').textContent = alerts.filter(a => a.severity === 'Critical' && !a.acknowledged).length;
      document.getElementById('cntWarning').textContent = alerts.filter(a => a.severity === 'Warning' && !a.acknowledged).length;
      document.getElementById('cntAck').textContent = alerts.filter(a => a.acknowledged).length;

      const filtered = alerts.filter(a => {
        const matchesSeverity = severityFilter === 'ALL' || a.severity === severityFilter;
        const matchesState = stateFilter === 'ALL' || 
          (stateFilter === 'Active' && !a.acknowledged) || 
          (stateFilter === 'Acknowledged' && a.acknowledged);
        return matchesSeverity && matchesState;
      });

      tbody.innerHTML = '';

      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="empty-cell">No matching alerts found.</td></tr>`;
        return;
      }

      filtered.forEach(a => {
        const tr = document.createElement('tr');
        tr.className = a.acknowledged ? 'row-ack' : '';
        tr.innerHTML = `
          <td><span class="status-badge ${a.severity.toLowerCase()}">${a.severity}</span></td>
          <td>
            <strong>${a.machineName}</strong>
            <div class="sub-text">${a.location} (${a.machineId})</div>
          </td>
          <td>
            <div class="alert-desc">${a.details}</div>
            <div class="sub-text">Logged at ${a.timestamp}</div>
          </td>
          <td><span class="text-critical">${a.rmsDeviation}</span></td>
          <td>
            ${a.acknowledged ? '<span class="state-tag ack">Acknowledged</span>' : '<span class="state-tag active">Active</span>'}
          </td>
          <td>
            ${!a.acknowledged ? `<button class="btn btn-outline btn-sm" onclick="acknowledgeAlert('${a.id}')">Acknowledge</button>` : '<span class="text-muted">—</span>'}
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    function acknowledgeAlert(alertId) {
      let alerts = JSON.parse(localStorage.getItem(ALERTS_STORE_KEY)) || [];
      alerts = alerts.map(a => {
        if (a.id === alertId) a.acknowledged = true;
        return a;
      });
      localStorage.setItem(ALERTS_STORE_KEY, JSON.stringify(alerts));
      renderAlerts();
    }

    renderAlerts();
  </script>
